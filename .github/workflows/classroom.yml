name: GitHub Classroom — AutoGrader

on: [push]

permissions:
  checks: write
  actions: read
  contents: read
  pull-requests: write
  models: read

jobs:
  autograde:
    name: AutoGrading
    runs-on: ubuntu-latest

    steps:
      - name: Checkout student repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-json-report

      - name: Run AutoGrader — Module 01 Basics
        id: grader-m01
        uses: classroom-resources/autograding-python-grader@v1
        with:
          setup-command: 'pip install pytest'
          python-test-file: 'curriculum-master/modules/module-01-basics/tests/test_basics.py'

      # Grading reporter posts score as a GitHub Check
      - name: Report grades to GitHub Classroom
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          AUTOGRADING_OUTPUT: ${{ steps.grader-m01.outputs.result }}
        with:
          runners: grader-m01

      # --- AI-Powered Failure Explanation ---
      # If tests failed, explain why in plain English
      - name: Capture test output for AI explanation
        if: failure()
        id: test-output
        run: |
          # Re-run pytest to capture output (the grader step doesn't expose raw output)
          TEST_OUTPUT=$(python -m pytest curriculum-master/modules/module-01-basics/tests/test_basics.py -v --tb=short 2>&1 || true)
          echo "test_output<<EOF" >> $GITHUB_OUTPUT
          echo "$TEST_OUTPUT" | tail -50 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Also grab the student's code
          STUDENT_CODE=""
          if [ -f "curriculum-master/modules/module-01-basics/starter-code/app.py" ]; then
            STUDENT_CODE=$(cat curriculum-master/modules/module-01-basics/starter-code/app.py | head -100)
          fi
          echo "student_code<<EOF" >> $GITHUB_OUTPUT
          echo "$STUDENT_CODE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: AI explains test failure
        if: failure()
        id: ai-explain
        uses: actions/ai-inference@v1
        with:
          prompt-file: '.github/prompts/explain-test-failure.prompt.yml'
          input: |
            test_output: ${{ steps.test-output.outputs.test_output }}
            student_code: ${{ steps.test-output.outputs.student_code }}

      - name: Post AI explanation as PR comment
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Find the PR associated with this push
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open'
            });

            if (prs.length === 0) {
              console.log('No open PR found for this branch — skipping AI comment.');
              return;
            }

            const prNumber = prs[0].number;
            const aiExplanation = `${{ steps.ai-explain.outputs.response }}`;

            const body = `## 🤖 AutoGrader — What Went Wrong

            ${aiExplanation}

            ---
            > 💡 Push a fix and the AutoGrader will run again automatically.
            > Need more help? Check the [resources](curriculum-master/modules/module-01-basics/resources.md) or ask a classmate.

            *This explanation was generated by AI to help you understand the failure. The AutoGrader tests are the source of truth.*`;

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.trim()
            });
