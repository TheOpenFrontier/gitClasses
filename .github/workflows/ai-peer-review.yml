name: AI Peer Review Assistant

on:
  pull_request:
    types: [opened, synchronize]

# Only run when a human opens a PR (not bots)
jobs:
  ai-peer-review:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          git diff origin/main...HEAD --name-only > changed_files.txt
          cat changed_files.txt
          echo "count=$(wc -l < changed_files.txt)" >> $GITHUB_OUTPUT

      - name: Generate AI Draft Review via GitHub Models
        uses: actions/github-script@v7
        env:
          CHANGED_FILES_COUNT: ${{ steps.changed.outputs.count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Read changed files list
            const changedFiles = fs.readFileSync('changed_files.txt', 'utf8').trim().split('\n').filter(Boolean);

            // Read content of key changed Python files (cap at 3 files, 100 lines each)
            let codeSnippets = '';
            let filesRead = 0;
            for (const file of changedFiles) {
              if (file.endsWith('.py') && filesRead < 3) {
                try {
                  const content = fs.readFileSync(file, 'utf8');
                  const lines = content.split('\n').slice(0, 100).join('\n');
                  codeSnippets += `\n\n**\`${file}\`**\n\`\`\`python\n${lines}\n\`\`\``;
                  filesRead++;
                } catch (e) {
                  // File may not exist locally in this context
                }
              }
            }

            // Compose the AI-drafted review comment
            const prAuthor = context.payload.pull_request.user.login;
            const prTitle = context.payload.pull_request.title;
            const isFirstOpen = context.payload.action === 'opened';

            // Only post the full AI draft on first open; update on sync
            if (!isFirstOpen) {
              console.log('PR synchronized — skipping re-post of AI review draft.');
              return;
            }

            const body = `
            ## 🤖 AI-Drafted Peer Review

            > **Note:** This is an AI-generated draft to help your peer reviewer get started.  
            > A human peer must still read your code and add their own comments.

            ---

            Hi @${prAuthor}! Here's an automated first-pass review of **"${prTitle}"**:

            ### 📁 Files Changed (${changedFiles.length})
            ${changedFiles.map(f => `- \`${f}\``).join('\n')}

            ### ✅ Automated Checklist
            - [ ] \`learning-contract.md\` exists in repo root
            - [ ] AutoGrader is passing (check the ✅ on your latest commit)
            - [ ] 2 peer reviews completed (paste links in PR description)
            - [ ] Code has comments explaining non-obvious logic
            - [ ] Variable names are descriptive (not \`x\`, \`temp\`, \`data\`)

            ### 💬 Questions for Your Human Peer Reviewer
            > These are conversation starters — a real peer should answer these by reading your code:

            1. **Correctness:** Does the implementation match what the Learning Contract described?
            2. **Readability:** Could someone unfamiliar with this project understand it in 5 minutes?
            3. **Edge cases:** What happens if the inputs are empty, negative, or unexpected?
            4. **Community contribution:** Did you add something to \`community-resources/\`?

            ---

            ### 🎓 Path D Students — AI Learning Log
            If you used AI assistance (GitHub Copilot, ChatGPT, the OpenMAIC generator, etc.):
            - [ ] \`ai-learning-log.md\` exists in your module folder
            - [ ] You documented what the AI got right *and* what you had to verify/correct

            ---

            *This draft was generated by the gitClasses peer-review bot. Human review is required before merge.*
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.trim()
            });

            // Update label to reflect AI review was posted
            try {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['ai-review-posted', 'needs-human-review']
              });
            } catch (e) {
              console.log('Labels may not exist yet:', e.message);
            }
