name: AI Review Facilitator

on:
  pull_request:
    types: [opened]

jobs:
  facilitate-review:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          git diff origin/main...HEAD --name-only > changed_files.txt
          echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT
          echo "count=$(wc -l < changed_files.txt)" >> $GITHUB_OUTPUT

      - name: Post AI Facilitation Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const changedFiles = fs.readFileSync('changed_files.txt', 'utf8')
              .trim().split('\n').filter(Boolean);

            const prAuthor = context.payload.pull_request.user.login;
            const prTitle = context.payload.pull_request.title;

            // Detect what type of work this is
            const hasPython = changedFiles.some(f => f.endsWith('.py'));
            const hasContract = changedFiles.some(f => f.includes('learning-contract'));
            const hasResources = changedFiles.some(f => f.includes('community-resources'));
            const hasTests = changedFiles.some(f => f.includes('tests/'));

            // Build reviewer guidance tailored to what changed
            let reviewerGuidance = '';
            if (hasPython) {
              reviewerGuidance += `
            #### For your Code Review
            - Does the code do what the Learning Contract described?
            - Are functions named clearly — would someone new understand them?
            - Are there comments where the logic is non-obvious?
            - What happens with edge cases (empty input, zero, negative numbers)?`;
            }
            if (hasContract) {
              reviewerGuidance += `
            #### For the Learning Contract
            - Are the 3 learning goals specific and measurable?
            - Is the timeline realistic for the module scope?`;
            }
            if (hasResources) {
              reviewerGuidance += `
            #### For the Community Contribution
            - Is the resource clearly described?
            - Would a classmate find this genuinely useful?`;
            }
            if (!reviewerGuidance) {
              reviewerGuidance = `\n- Read through the changes and leave at least one specific, constructive comment.`;
            }

            const body = `
            ## 👋 Ready for Review — @${prAuthor}

            Great work opening a PR for **"${prTitle}"**! Here's what happens next:

            ---

            ### ✅ Pre-Review Checklist (for @${prAuthor})
            Before requesting reviewers, confirm:
            - [ ] The AutoGrader is passing (check the ✅ on your latest commit above)
            - [ ] \`learning-contract.md\` is committed to your repo root
            - [ ] Your PR description explains what you built and why
            - [ ] You've added a resource to \`curriculum-master/community-resources/\`

            ---

            ### 🔍 Peer Reviewer Guide
            When you review this PR, focus on:
            ${reviewerGuidance}

            **How to leave a great review:**
            1. Click **"Files changed"** above → read through the diff
            2. Click the **➕** next to any line to leave an inline comment
            3. When done, click **"Review changes"** → choose **Comment** or **Approve**

            > 📖 Need help? See [COMMUNITY_GUIDELINES.md](../blob/main/COMMUNITY_GUIDELINES.md) for the Code of Review and the 2-for-1 rule.

            ---

            ### 📋 Changed Files (${changedFiles.length})
            ${changedFiles.map(f => `- \`${f}\``).join('\n')}

            ---

            *This checklist was generated automatically to help both sides of the review process.*
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.trim()
            });

            // Add labels
            try {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['needs-peer-review']
              });
            } catch (e) {
              console.log('Label may not exist yet — skipping:', e.message);
            }
